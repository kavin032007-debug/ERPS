spring.application.name=erps-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# Vaadin Configuration
vaadin.launch-browser=false
vaadin.productionMode=true

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Institutional Configuration (Generic Defaults)
app.institution.name=${INSTITUTION_NAME:Your Institution Name}
app.institution.address=${INSTITUTION_ADDRESS:Campus Road, Knowledge City, State - 600001}
app.institution.university=${UNIVERSITY_NAME:Affiliating State University}
app.institution.logo=${INSTITUTION_LOGO:}

# MFA setting (overridden in dev/prod profiles)
app.mfa.enabled=${APP_MFA_ENABLED:false}
