# Dev Profile: In-memory H2 with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:erpsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Dev / Demo specific flags
app.mfa.enabled=${APP_MFA_ENABLED:false}
app.demo.seed-data=true
