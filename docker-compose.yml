version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: erps-postgres
    restart: always
    environment:
      POSTGRES_DB: erps_db
      POSTGRES_USER: erps_user
      POSTGRES_PASSWORD: erps_secret_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erps_user -d erps_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erps-application
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/erps_db
      DB_USER: erps_user
      DB_PASSWORD: erps_secret_password
      PORT: 8080
      MFA_ENFORCED: "false" # Set to true for strict production MFA
      FIRST_ADMIN_EMAIL: admin@institution.edu
      FIRST_ADMIN_PASSWORD: AdminSuperSecret2026!
      DEMO_MODE: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
    driver: local
